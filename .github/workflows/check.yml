name: VPN Gate Node Check

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          CHECK_WORKER: "https://check2026.chn42080001.workers.dev/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled for the repo default branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          REPO="$GITHUB_REPOSITORY"

          echo "Repository: $REPO"

          # 读取实际默认分支，而不是写死 main
          DEFAULT_BRANCH=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO" \
            | python -c 'import sys, json; print(json.load(sys.stdin).get("default_branch", "main"))')

          echo "Default branch: $DEFAULT_BRANCH"

          # 检查 Pages 是否已经启用
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/pages")

          echo "Pages API status before: $CODE"

          if [ "$CODE" = "404" ]; then
            echo "Enabling GitHub Pages with GitHub Actions source and /public path..."
            curl -fsSL -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"build_type\":\"workflow\",\"source\":{\"branches\":[\"$DEFAULT_BRANCH\"],\"path\":\"/public\"}}" \
              "https://api.github.com/repos/$REPO/pages"

            echo "Waiting for Pages site to be created..."
            sleep 10
          fi

      - name: Wait until GitHub Pages API is ready
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          REPO="$GITHUB_REPOSITORY"

          for i in $(seq 1 12); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/pages" || true)

            echo "Pages API status: $CODE"

            if [ "$CODE" = "200" ]; then
              echo "GitHub Pages is ready"
              exit 0
            fi

            sleep 5
          done

          echo "GitHub Pages API did not become ready within timeout"
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: 'auto'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: echo "site: https://<你的用户名>.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"
